<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>travel.io — Reset Password</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <section class="auth-form-panel">
      <h1 class="auth-title">Reset your password.</h1>
      <p class="auth-switch">Remember your password? <a href="login.html">Sign In</a></p>

      <form id="request-reset-form" class="reset-step is-active" novalidate>
        <p class="auth-instruction">Enter the email linked to your account to receive a password reset code.</p>
        <div class="auth-field">
          <label for="resetEmail">Email</label>
          <input id="resetEmail" type="email" placeholder="Your mail" autocomplete="email" required>
        </div>
        <button class="auth-button" type="submit">Send Reset Code</button>
      </form>

      <form id="verify-reset-form" class="reset-step" novalidate>
        <p class="auth-instruction">Enter the reset code, then choose a new password.</p>
        <div class="reset-code-box">
          <span>Reset code</span>
          <strong id="reset-code-preview">------</strong>
        </div>
        <div class="auth-field">
          <label for="resetCode">Reset Code</label>
          <input id="resetCode" type="text" placeholder="6-digit code" inputmode="numeric" maxlength="6" required>
        </div>
        <div class="auth-field">
          <label for="newPassword">New Password</label>
          <input id="newPassword" type="password" placeholder="Your new password" autocomplete="new-password" required>
        </div>
        <div class="auth-field">
          <label for="confirmPassword">Re-enter Password</label>
          <input id="confirmPassword" type="password" placeholder="Repeat your new password" autocomplete="new-password" required>
        </div>
        <button class="auth-button" type="submit">Reset Password</button>
      </form>

      <p class="auth-error" id="auth-error" aria-live="polite"></p>
      <p class="auth-success" id="auth-success" aria-live="polite"></p>
    </section>

    <section class="auth-visual">
      <img class="auth-static-image" src="../assets/images/login.jpg" alt="Travel placeholder">
    </section>
  </main>

  <script src="auth-store.js"></script>
  <script src="forgot-password.js"></script>
</body>
</html>
